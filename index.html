<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countup Multi-Device Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    .setup-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
    .btn-add-player { background: #0288d1; color: white; font-weight: bold; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    .btn-add-player:hover { background: #039be5; }

    .status-box { display: flex; justify-content: center; font-size: 1.1rem; margin-bottom: 20px; background: #2a2a2a; padding: 10px; border-radius: 6px; flex-wrap: wrap; gap: 10px; }
    .player-card { flex: 1; min-width: 140px; padding: 10px; border-radius: 6px; border: 2px solid #444; background: #181818; }
    .active-player { border-color: #00e676; background: #1e3323; }

    .player-name-input { background: transparent; border: none; border-bottom: 1px dashed #666; color: #fff; font-size: 1.1rem; font-weight: bold; text-align: center; width: 90%; margin-bottom: 8px; }
    .player-name-input:focus { border-bottom-color: #00e676; outline: none; }

    .turn-summary { background: #262626; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
    .dart-list { font-size: 1.3rem; font-weight: bold; color: #00e676; letter-spacing: 2px; }

    .modifier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .btn-mod { background: #333; color: #fff; border: 2px solid #555; padding: 12px; font-size: 1.1rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn-mod.selected { background: #ff9800; color: #000; border-color: #ffb74d; }

    .board-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
    button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 12px; font-size: 1.1rem; border-radius: 4px; cursor: pointer; }
    button:hover { background: #3d3d3d; }
    button:active { background: #555; }

    .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .btn-action { background: #d32f2f; font-weight: bold; }
    .btn-action:hover { background: #f44336; }
    .btn-undo { background: #f57c00; font-weight: bold; }
    .btn-undo:hover { background: #ff9800; }
    .btn-submit { background: #2e7d32; font-weight: bold; grid-column: span 2; padding: 15px; font-size: 1.2rem; }
    .btn-submit:hover { background: #388e3c; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Countup Multi-Device Tracker</h2>

    <div class="setup-bar">
      <button id="btn-add-player" class="btn-add-player">+ Add Player</button>
    </div>

    <!-- Dynamic Players Display -->
    <div class="status-box" id="players-container">
      <!-- Player cards injected dynamically -->
    </div>

    <!-- Active Turn State -->
    <div class="turn-summary">
      <p style="margin:0 0 5px 0;">Current Turn: <strong><span id="current-player-display">Player 1</span></strong> | Round: <span id="current-round-display">1</span></p>
      <div>Darts Thrown: <span class="dart-list" id="darts-display">[-] [-] [-]</span></div>
    </div>

    <!-- Multipliers -->
    <div class="modifier-grid">
      <button class="btn-mod selected" id="mod-single" data-mult="1">SINGLE (1x)</button>
      <button class="btn-mod" id="mod-double" data-mult="2">DOUBLE (2x)</button>
      <button class="btn-mod" id="mod-triple" data-mult="3">TRIPLE (3x)</button>
    </div>

    <!-- Dart Board Inputs -->
    <div class="board-grid" id="number-board">
      <script>
        for (let i = 1; i <= 20; i++) {
          document.write(`<button class="btn-num" data-base="${i}">${i}</button>`);
        }
      </script>
      <button class="btn-num" data-base="25" style="grid-column: span 2; background: #1565c0;">25 (Outer Bull)</button>
      <button class="btn-num" data-base="50" style="grid-column: span 2; background: #2e7d32;">50 (Bullseye)</button>
      <button class="btn-num" data-base="0" style="grid-column: span 1; background: #424242;">MISS</button>
    </div>

    <!-- Controls -->
    <div class="action-grid">
      <button id="btn-undo" class="btn-undo">↩ Undo Dart</button>
      <button id="btn-reset" class="btn-action">Reset Game</button>
      <button id="btn-submit-turn" class="btn-submit">Submit Turn ➔</button>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://countupmultivice-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const roomId = "9597"; 
    const gameStateRef = ref(db, `${roomId}/state`);

    // UI elements
    const playersContainer = document.getElementById("players-container");
    const currentPlayerDisplay = document.getElementById("current-player-display");
    const currentRoundDisplay = document.getElementById("current-round-display");
    const dartsDisplay = document.getElementById("darts-display");
    const modSingle = document.getElementById("mod-single");
    const btnAddPlayer = document.getElementById("btn-add-player");

    let localState = {};
    let currentMultiplier = 1;

    // Listen to Firebase Realtime DB Updates
    onValue(gameStateRef, (snapshot) => {
      const state = snapshot.val();
      if (!state) {
        initGameState();
        return;
      }

      localState = state;
      renderUI(state);
    });

    function initGameState() {
      set(gameStateRef, {
        playerCount: 2,
        currentPlayer: 1,
        currentRound: 1,
        playerNames: { "1": "Player 1", "2": "Player 2" },
        dartScores: { "1": 0, "2": 0 },
        currentTurnDarts: [],
        gameOver: false
      });
    }

    function renderUI(state) {
      const totalPlayers = state.playerCount || 2;
      const activeP = state.currentPlayer || 1;
      const scores = state.dartScores || {};
      const names = state.playerNames || {};
      const currentDarts = state.currentTurnDarts || [];

      // Render Dynamic Player Cards with Editable Name Inputs
      playersContainer.innerHTML = "";
      for (let p = 1; p <= totalPlayers; p++) {
        const pName = names[p] || `Player ${p}`;
        const card = document.createElement("div");
        card.className = `player-card ${p === activeP ? 'active-player' : ''}`;
        card.innerHTML = `
          <input type="text" class="player-name-input" data-player="${p}" value="${pName}" />
          <p style="margin:0;">Score: <strong>${scores[p] || 0}</strong></p>
        `;
        playersContainer.appendChild(card);
      }

      // Add Name Input Event Listeners
      document.querySelectorAll(".player-name-input").forEach(input => {
        input.addEventListener("change", (e) => {
          const pId = e.target.dataset.player;
          const newName = e.target.value.trim() || `Player ${pId}`;
          update(gameStateRef, {
            [`playerNames/${pId}`]: newName
          });
        });
      });

      const activeName = names[activeP] || `Player ${activeP}`;
      currentPlayerDisplay.textContent = activeName;
      currentRoundDisplay.textContent = state.currentRound || 1;

      // Render 3 Darts display
      let dartsFormatted = [];
      for (let i = 0; i < 3; i++) {
        if (currentDarts[i] !== undefined) {
          dartsFormatted.push(`[${currentDarts[i].label}]`);
        } else {
          dartsFormatted.push(`[-]`);
        }
      }
      dartsDisplay.textContent = dartsFormatted.join(" ");
    }

    // Add Player Handler
    btnAddPlayer.addEventListener("click", () => {
      const currentCount = localState.playerCount || 2;
      const newCount = currentCount + 1;
      
      update(gameStateRef, {
        playerCount: newCount,
        [`playerNames/${newCount}`]: `Player ${newCount}`,
        [`dartScores/${newCount}`]: 0
      });
    });

    // Modifier Selection Logic
    document.querySelectorAll(".btn-mod").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".btn-mod").forEach(b => b.classList.remove("selected"));
        e.target.classList.add("selected");
        currentMultiplier = parseInt(e.target.dataset.mult);
      });
    });

    function resetMultiplier() {
      currentMultiplier = 1;
      document.querySelectorAll(".btn-mod").forEach(b => b.classList.remove("selected"));
      modSingle.classList.add("selected");
    }

    // Handle Dart Number Button Clicks
    document.getElementById("number-board").addEventListener("click", (e) => {
      const baseValue = parseInt(e.target.dataset.base);
      if (isNaN(baseValue)) return;

      const currentDarts = localState.currentTurnDarts || [];
      if (currentDarts.length >= 3) {
        alert("3 darts already thrown! Press 'Submit Turn' to proceed.");
        return;
      }

      let points = 0;
      let label = "";

      if (baseValue === 0) {
        label = "MISS";
        points = 0;
      } else if (baseValue === 50) {
        label = "BULL";
        points = 50;
      } else if (baseValue === 25) {
        label = currentMultiplier === 2 ? "BULL" : "25";
        points = currentMultiplier === 2 ? 50 : 25;
      } else {
        points = baseValue * currentMultiplier;
        const prefix = currentMultiplier === 3 ? "T" : (currentMultiplier === 2 ? "D" : "");
        label = `${prefix}${baseValue}`;
      }

      const activePlayer = localState.currentPlayer || 1;
      const currentScores = localState.dartScores || {};
      const newScore = (currentScores[activePlayer] || 0) + points;

      const updatedDarts = [...currentDarts, { points, label }];

      update(gameStateRef, {
        [`dartScores/${activePlayer}`]: newScore,
        currentTurnDarts: updatedDarts
      });

      resetMultiplier();
    });

    // Handle Undo Button
    document.getElementById("btn-undo").addEventListener("click", () => {
      const currentDarts = localState.currentTurnDarts || [];
      if (currentDarts.length === 0) return;

      const lastDart = currentDarts.pop();
      const activePlayer = localState.currentPlayer || 1;
      const currentScores = localState.dartScores || {};
      const updatedScore = Math.max(0, (currentScores[activePlayer] || 0) - lastDart.points);

      update(gameStateRef, {
        [`dartScores/${activePlayer}`]: updatedScore,
        currentTurnDarts: currentDarts
      });
    });

    // Handle Submit Turn Button
    document.getElementById("btn-submit-turn").addEventListener("click", () => {
      const activePlayer = localState.currentPlayer || 1;
      const totalPlayers = localState.playerCount || 2;

      let nextPlayer = activePlayer + 1;
      let nextRound = localState.currentRound || 1;

      if (nextPlayer > totalPlayers) {
        nextPlayer = 1;
        nextRound += 1;
      }

      update(gameStateRef, {
        currentPlayer: nextPlayer,
        currentRound: nextRound,
        currentTurnDarts: []
      });
    });

    // Reset Game
    document.getElementById("btn-reset").addEventListener("click", () => {
      if (confirm("Reset current game scores?")) {
        initGameState();
      }
    });
  </script>
</body>
</html>
